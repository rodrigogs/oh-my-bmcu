name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PLATFORMIO_VERSION: "6.1.19"
  # platform.py installs the Linux RISC-V toolchain from this branch (not pinned in platformio.ini).
  TOOLCHAIN_REPO: https://github.com/Community-PIO-CH32V/toolchain-riscv-linux.git
  TOOLCHAIN_BRANCH: gcc12
  # V10.5 release commit: its sources and platformio.ini must still rebuild to its published binaries.
  UPSTREAM_V10_5: fbff4e3
  # Fail the A1 build if the image grows past 56 KiB (upload limit is 60 KiB, NVM lives above it).
  IMAGE_BUDGET_BYTES: "57344"
  # Fail the A1 build if free RAM (between _ebss and the stack, see the linker script) drops
  # below 4 KiB. Measured 6,528 B on a1_solo_autoload_rgboff; RAM is 20480 B total.
  RAM_HEADROOM_FLOOR_BYTES: "4096"

jobs:
  a1:
    name: A1 images (a1_solo_autoload_rgboff and the #148 A/B image)
    runs-on: ubuntu-24.04
    # Flashable images are only published once the host tests, the V10.5 reproduction and the
    # static analysis pass.
    needs: [unit-tests, reproduce-upstream, static-analysis]
    env:
      ENVS: a1_solo_autoload_rgboff a1_solo_autoload_rgboff_no_boot_restore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: ./.github/actions/setup-pio
        with:
          platformio-version: ${{ env.PLATFORMIO_VERSION }}
          toolchain-repo: ${{ env.TOOLCHAIN_REPO }}
          toolchain-branch: ${{ env.TOOLCHAIN_BRANCH }}

      - name: Build
        run: pio run $(printf -- '-e %s ' $ENVS)

      - name: Check size and record hash
        run: |
          echo "- toolchain-riscv-linux: \`$(git -C ~/.platformio/packages/toolchain-riscv rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
          sizebin=$(ls ~/.platformio/packages/toolchain-riscv/bin/*-size | head -1)
          nm=$(ls ~/.platformio/packages/toolchain-riscv/bin/*-nm | head -1)
          for e in $ENVS; do
            bin=.pio/build/$e/firmware.bin
            elf=.pio/build/$e/firmware.elf
            size=$(stat -c %s "$bin")
            sha=$(sha256sum "$bin" | cut -d' ' -f1)
            # .data+.bss is the RAM the linker map already commits; the remaining headroom is
            # between _ebss (end of .bss) and _heap_end (the stack's fixed 2 KiB reservation,
            # see the ldscript's .stack section), so it is real free RAM, not just "20480 minus
            # .data+.bss" -- the stack is reserved regardless of how much heap/bss is used.
            ram_used=$("$sizebin" --format=sysv "$elf" | awk '$1 == ".data" || $1 == ".bss" {sum += $2} END {print sum}')
            ebss_hex=$("$nm" "$elf" | awk '$3 == "_ebss" {print $1}')
            heap_end_hex=$("$nm" "$elf" | awk '$3 == "_heap_end" {print $1}')
            ram_headroom=$(( 16#$heap_end_hex - 16#$ebss_hex ))
            echo "$e: sha256 ${sha}  size ${size}  ram_used ${ram_used}  ram_headroom ${ram_headroom}"
            {
              echo "### $e"
              echo "- size: ${size} bytes (budget ${IMAGE_BUDGET_BYTES})"
              echo "- sha256: \`${sha}\`"
              echo "- RAM: .data+.bss ${ram_used} bytes, headroom ${ram_headroom} bytes (floor ${RAM_HEADROOM_FLOOR_BYTES})"
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$size" -gt "$IMAGE_BUDGET_BYTES" ]; then
              echo "::error::$e firmware.bin is ${size} bytes, over the ${IMAGE_BUDGET_BYTES}-byte budget"
              exit 1
            fi
            if [ "$ram_headroom" -lt "$RAM_HEADROOM_FLOOR_BYTES" ]; then
              echo "::error::$e RAM headroom is ${ram_headroom} bytes, below the ${RAM_HEADROOM_FLOOR_BYTES}-byte floor"
              exit 1
            fi
          done

      # Properties the host tests cannot see: the fail-safe trap handlers and both USART handlers
      # must replace the SDK's weak endless loops, and no soft-double routine may be linked.
      - name: Check ELF symbols
        run: |
          nm=$(ls ~/.platformio/packages/toolchain-riscv/bin/*-nm | head -1)
          for e in $ENVS; do
            syms=$("$nm" .pio/build/$e/firmware.elf)
            for s in HardFault_Handler NMI_Handler Break_Point_Handler USART1_IRQHandler USART3_IRQHandler; do
              echo "$syms" | grep -q " T $s\$" || { echo "::error::$e: $s is not a strong symbol"; exit 1; }
            done
            if echo "$syms" | grep -E ' __(add|sub|mul|div)df3$| __(extendsfdf2|truncdfsf2|float(un)?sidf|fixuns?dfsi|(eq|ne|gt|ge|lt|le|unord)df2)$'; then
              echo "::error::$e links soft-double routines"; exit 1
            fi
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          # On pull_request github.sha is the synthetic merge commit; name artifacts after the real head.
          name: oh-my-bmcu-a1-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.event_name }}
          path: |
            .pio/build/a1_solo_autoload_rgboff/firmware.bin
            .pio/build/a1_solo_autoload_rgboff/firmware.elf
            .pio/build/a1_solo_autoload_rgboff_no_boot_restore/firmware.bin
            .pio/build/a1_solo_autoload_rgboff_no_boot_restore/firmware.elf
          if-no-files-found: error

      # Compile-smoke the variant macros this job's two ENVS never touch: env:moj takes the
      # BMCU_DM_TWO_MICROSWITCH=0 branch (~11 sites in Motion_control.cpp), and env:fw with each
      # of BMCU_SOFT_LOAD, DBMCU_P1S and BMCU_ONLINE_LED_FILAMENT_RGB set once selects the load-mode
      # branches and the RGB-gated blocks in ws2812.cpp. Same platform pin as ENVS, so this reuses
      # the cache above; gating (not uploaded, no size check) because a fork refactor that breaks
      # one of these variants must fail CI, not go unnoticed until an upstream user hits it. Runs
      # last in the job: PlatformIO keys .pio/build/ to a single project-wide checksum, and each
      # of these ${sysenv.*}-driven env:fw builds changes that checksum, which makes PlatformIO
      # wipe the whole .pio/build/ directory (not just env:fw's own subdirectory) before it
      # rebuilds -- if this ran earlier it would delete the a1 envs' firmware.bin/.elf out from
      # under the size-check, ELF-symbol-check and artifact-upload steps above.
      - name: Compile-smoke the other build-flag variants
        run: |
          pio run -e moj
          BMCU_DM_TWO_MICROSWITCH=1 BMCU_ONLINE_LED_FILAMENT_RGB=0 DBMCU_P1S=0 BMCU_SOFT_LOAD=1 BAMBU_BUS_AMS_NUM=0 AMS_RETRACT_LEN=0.095f pio run -e fw
          BMCU_DM_TWO_MICROSWITCH=1 BMCU_ONLINE_LED_FILAMENT_RGB=0 DBMCU_P1S=1 BMCU_SOFT_LOAD=0 BAMBU_BUS_AMS_NUM=0 AMS_RETRACT_LEN=0.095f pio run -e fw
          BMCU_DM_TWO_MICROSWITCH=1 BMCU_ONLINE_LED_FILAMENT_RGB=1 DBMCU_P1S=0 BMCU_SOFT_LOAD=0 BAMBU_BUS_AMS_NUM=0 AMS_RETRACT_LEN=0.095f pio run -e fw

  unit-tests:
    name: Host unit tests (env:native)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: ./.github/actions/setup-pio
        with:
          platformio-version: ${{ env.PLATFORMIO_VERSION }}
          key-prefix: platformio-native
          toolchain-in-key: "false"

      - name: Verbatim firmware copies in tests still match src/
        run: python3 scripts/check_test_copies.py

      - name: build_all_firmwares.sh OUT_DIR guards (stub pio)
        run: bash scripts/test_build_all_firmwares.sh

      - name: Guard scripts themselves (fixtures, dependency-free)
        run: python3 -m unittest discover -s scripts/tests

      - run: pio test -e native

      - run: pio test -e native_asan

  static-analysis:
    name: Static analysis (pio check, cppcheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # pio check reads the toolchain's predefined macros, so it needs the same platform install
      # (and cache) as the a1 job.
      - uses: ./.github/actions/setup-pio
        with:
          platformio-version: ${{ env.PLATFORMIO_VERSION }}
          toolchain-repo: ${{ env.TOOLCHAIN_REPO }}
          toolchain-branch: ${{ env.TOOLCHAIN_BRANCH }}

      # cppcheck over src/ with the A1 env's defines (check_* options in env:base). Gating on
      # medium and high: the baseline has none left after triage. Low (style) findings are listed
      # in the step summary but do not fail the job.
      - name: pio check
        run: |
          set -o pipefail
          pio check -e a1_solo_autoload_rgboff --fail-on-defect=high --fail-on-defect=medium | tee pio-check.txt

      - name: Report the findings
        if: always()
        run: |
          # A header finding is reported once per file that includes it, so count unique lines.
          defects=$(grep -E '^src/[^ ]+:[0-9]+: \[(low|medium|high):' pio-check.txt | sort -u || true)
          {
            echo "### pio check (cppcheck), a1_solo_autoload_rgboff"
            for s in high medium low; do
              echo "- ${s}: $(printf '%s\n' "$defects" | grep -c "\[${s}:" || true)"
            done
            if [ -n "$defects" ]; then
              echo '```'
              printf '%s\n' "$defects"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  reproduce-upstream:
    name: Reproduce upstream V10.5 SOLO images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-pio
        with:
          platformio-version: ${{ env.PLATFORMIO_VERSION }}
          toolchain-repo: ${{ env.TOOLCHAIN_REPO }}
          toolchain-branch: ${{ env.TOOLCHAIN_BRANCH }}

      - name: Prepare the V10.5 tree with this branch's platform pins
        run: |
          git worktree add --detach /tmp/v10.5 HEAD
          # Replace src/ entirely so files added after V10.5 cannot leak into this build, and use
          # V10.5's own platformio.ini so fork build-flag changes cannot look like toolchain drift.
          rm -rf /tmp/v10.5/src
          git -C /tmp/v10.5 checkout "$UPSTREAM_V10_5" -- src
          git show "$UPSTREAM_V10_5:platformio.ini" > /tmp/v10.5/platformio.ini
          python3 scripts/apply_platform_pins.py platformio.ini /tmp/v10.5/platformio.ini
          git show "$UPSTREAM_V10_5:firmwares/manifest.txt" > /tmp/v10.5-reference-manifest.txt

      - name: Build the 12 SOLO images
        run: BUILD_ONLY_SOLO=1 bash /tmp/v10.5/build_all_firmwares.sh

      - name: Compare with the manifest published in V10.5
        run: |
          python3 scripts/compare_manifest.py /tmp/v10.5/build/firmwares/manifest.txt /tmp/v10.5-reference-manifest.txt --expect-count 12
          echo "- V10.5 SOLO images reproduced with toolchain-riscv-linux \`$(git -C ~/.platformio/packages/toolchain-riscv rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
