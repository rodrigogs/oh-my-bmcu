[platformio]
; oh-my-bmcu: plain `pio run` builds only our A1 target instead of every env below.
default_envs = a1_solo_autoload_rgboff

[env:base]
; Pinned to the revisions that reproduce the published V10.5 binaries bit for bit.
; The RISC-V toolchain is picked per host OS by platform.py (toolchain-riscv-{mac,linux,windows}#gcc12),
; so it is not pinned here; CI rebuilds the V10.5 sources and compares against firmwares/manifest.txt instead.
platform = https://github.com/Community-PIO-CH32V/platform-ch32v.git#8cf3b51c0ee537756a04c28336f1466e03424020
platform_packages =
    framework-wch-noneos-sdk @ https://github.com/Community-PIO-CH32V/framework-wch-noneos-sdk.git#34b1b78322fa6ede59c89e89417f20d75ca27717
framework = noneos-sdk
board = genericCH32V203C8T6

board_upload.maximum_size = 61440
build_type = release
board_build.use_lto = yes
board_build.use_builtin_debug_code = no
board_build.cpp_support = yes


build_flags =
    -DSYSCLK_FREQ_144MHz_HSI=144000000

      ; --- Hardware variants ---
;DM board: dual microswitch + autoload (first switch assist)
;    -DBMCU_DM_TWO_MICROSWITCH=1

; --- LEDs: show filament RGB on ONLINE LED when loaded ---
;    -DBMCU_ONLINE_LED_FILAMENT_RGB=1

; --- P1 / X1 / P2 Printer ---
;  -DBMCU_P1S=1

; --- Soft load ---
;    -DBMCU_SOFT_LOAD=1

[env:fw]
extends = env:base
extra_scripts = pre:scripts/check_fw_env.py
build_flags =
  ${env:base.build_flags}
  -DBMCU_DM_TWO_MICROSWITCH=${sysenv.BMCU_DM_TWO_MICROSWITCH}
  -DBMCU_ONLINE_LED_FILAMENT_RGB=${sysenv.BMCU_ONLINE_LED_FILAMENT_RGB}
  -DBMCU_P1S=${sysenv.DBMCU_P1S}
  -DBMCU_SOFT_LOAD=${sysenv.BMCU_SOFT_LOAD}
  -DBAMBU_BUS_AMS_NUM=${sysenv.BAMBU_BUS_AMS_NUM}
  -DAMS_RETRACT_LEN=${sysenv.AMS_RETRACT_LEN}

; ---- oh-my-bmcu target: Bambu Lab A1, single BMCU 370C ----
; standard(A1) load force, SOLO slot (AMS A) with 9.5 cm retract, AUTOLOAD (DM two-microswitch), filament RGB off.
; Same flags, in the same order, as env:fw with the matching environment variables.
[env:a1_solo_autoload_rgboff]
extends = env:base
build_flags =
  ${env:base.build_flags}
  -DBMCU_DM_TWO_MICROSWITCH=1
  -DBMCU_ONLINE_LED_FILAMENT_RGB=0
  -DBMCU_P1S=0
  -DBMCU_SOFT_LOAD=0
  -DBAMBU_BUS_AMS_NUM=0
  -DAMS_RETRACT_LEN=0.095f

; A/B image for upstream #148: the A1 target, but the loaded channel saved at power-off is only
; reported in use once the printer references it, not from boot (src/boot_restore.h).
[env:a1_solo_autoload_rgboff_no_boot_restore]
extends = env:a1_solo_autoload_rgboff
build_flags =
  ${env:a1_solo_autoload_rgboff.build_flags}
  -DBMCU_BOOT_RESTORE_LOADED=0

; ---- oh-my-bmcu host unit tests: `pio test -e native` ----
; Only hardware-free modules are compiled from src/ (add them to build_src_filter as they get tests).
[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<crc_bus.c>
build_flags = -Wall -Wextra -Werror -Isrc

[env:moj]
extends = env:base
build_flags =
  ${env:base.build_flags}
  -DBAMBU_BUS_AMS_NUM=0
  -DAMS_RETRACT_LEN=0.095f


